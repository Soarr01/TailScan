name: Build iPhone IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for iPhone
        run: |
          set -o pipefail
          xcodebuild -project TailScan.xcodeproj -scheme TailScan -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee build.log
      - name: Package unsigned IPA
        run: |
          mkdir -p output/Payload
          cp -R build/Build/Products/Release-iphoneos/TailScan.app output/Payload/
          test -f output/Payload/TailScan.app/TailScan
          cd output
          zip -qry TailScan.ipa Payload
          shasum -a 256 TailScan.ipa > TailScan.ipa.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: TailScan-IPA
          path: |
            ios/output/TailScan.ipa
            ios/output/TailScan.ipa.sha256
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: ios/build.log
